
name: My First CI

on:
  push:

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Download Project
        env:
          SSHPASS: ${{ secrets.gizlin }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            root@45.61.176.113 \
            "git clone https://github.com/USERNAME/REPOSITORY.git /var/www/myproject"
