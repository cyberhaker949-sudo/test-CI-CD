
name: My First CI

on:
  push:

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect to VPS
        env:
          SSHPASS: ${{ secrets.gizlin }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            ydp.tejribe.online@45.61.158.122 \
            "whoami && hostname && uptime"
